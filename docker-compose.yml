services:
  app:
    build:
      context: .
    image: ospiti-web:dev
    container_name: ospiti-web-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      APP_AMBIENTE: local
      APP_DATABASE_HOST: db
      APP_DATABASE_USER: root
      APP_DATABASE_PASS: ""
      APP_DATABASE_NOME: db
      # CORS: permetti le origini cross-origin in allowlist (comma-separated).
      # Lasciare vuoto in produzione finché non sono note.
      APP_CORS_ALLOWED_ORIGINS: ""
    ports:
      - "8081:80"
    volumes:
      - "./public:/var/www/html/public"
      - "./src:/var/www/html/src"
      - "./views:/var/www/html/views"
      - "./config:/var/www/html/config"

  db:
    image: mariadb:11
    container_name: ospiti-web-db
    environment:
      MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: "1"
      MARIADB_ROOT_PASSWORD: ""
      MARIADB_DATABASE: db
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - db-data:/var/lib/mysql
      - "./db/install.sql:/docker-entrypoint-initdb.d/01-install.sql:ro"
      - "./db/seed_admin.sql:/docker-entrypoint-initdb.d/02-seed_admin.sql:ro"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
